<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Santa's Workshop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Falling snow sits behind everything -->
  <div id="snow" aria-hidden="true"></div>

  <!-- The game draws each screen inside here -->
  <main id="app" aria-live="polite"></main>

  <noscript>Please turn on JavaScript to play Santa's Workshop.</noscript>

  <!-- Order matters: settings and puzzles first, then the game -->
  <script src="js/settings.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
